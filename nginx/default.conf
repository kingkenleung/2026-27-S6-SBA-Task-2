server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 2m;

    # Reverse proxy to the PHP-FPM container.
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 60s;
    }

    # Static assets, including the intentionally exposed secret.key.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
